name: Cleanup Empty Rooms

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete empty rooms
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Install dependencies
          pip install google-auth requests --quiet

          python3 - <<'EOF'
          import json, os, requests
          import google.auth.transport.requests
          from google.oauth2 import service_account

          db_url = os.environ["FIREBASE_DATABASE_URL"].rstrip("/")
          sa_info = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])

          creds = service_account.Credentials.from_service_account_info(
              sa_info,
              scopes=["https://www.googleapis.com/auth/firebase.database",
                      "https://www.googleapis.com/auth/userinfo.email"],
          )
          creds.refresh(google.auth.transport.requests.Request())
          token = creds.token

          headers = {"Authorization": f"Bearer {token}"}

          # Fetch all rooms (shallow to avoid downloading everything)
          resp = requests.get(f"{db_url}/rooms.json?shallow=true", headers=headers)
          resp.raise_for_status()
          rooms = resp.json()

          if not rooms:
              print("No rooms found.")
              exit(0)

          deleted = 0
          for room_id in rooms:
              room_resp = requests.get(f"{db_url}/rooms/{room_id}/users.json", headers=headers)
              room_resp.raise_for_status()
              users = room_resp.json()
              if not users:
                  del_resp = requests.delete(f"{db_url}/rooms/{room_id}.json", headers=headers)
                  del_resp.raise_for_status()
                  print(f"Deleted empty room: {room_id}")
                  deleted += 1

          print(f"Done. {deleted} room(s) deleted.")
          EOF
